name: Grade live
on:
  schedule:
    # Every 10 minutes while games are on (cron is UTC: 00-07 UTC = 6 PM-2 AM CT; 18-23 UTC covers afternoon tips).
    - cron: '*/10 0-7 * * *'
    - cron: '*/15 18-23 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/grade_live.py
      - name: Publish if changed
        run: |
          git config user.name "plasmapicks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/
          git diff --cached --quiet && exit 0
          git commit -m "Grade Top 10 $(date -u +%F\ %H:%M)"
          git pull --rebase -q && git push
