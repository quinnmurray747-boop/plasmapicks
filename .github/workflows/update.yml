name: Update slate
on:
  schedule:
    # Central time (cron is UTC; CST = UTC-6, CDT = UTC-5):
    # 10:07 AM morning slate, 3:25 PM lock run after the injury reports, 5:07 PM late lines (picks stay locked)
    - cron: '7 16 * * *'
    - cron: '25 20 * * *'
    - cron: '25 21 * * *'
    - cron: '7 23 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas pyarrow requests
      - run: npm install --no-save --no-audit --no-fund jsdom@24
      - name: Download hoopR box scores
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/sportsdataverse/hoopr-nba-data /tmp/hoopr
          cd /tmp/hoopr && git checkout HEAD -- nba/player_box/parquet/player_box_2027.parquet
      - name: Build slate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/update.py /tmp/hoopr/nba/player_box/parquet/player_box_2027.parquet
      - name: Publish if changed
        run: |
          git config user.name "plasmapicks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/
          git diff --cached --quiet || git commit -m "Update slate $(date -u +%F\ %H:%M)"
          git push
