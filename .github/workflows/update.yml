name: Update slate
on:
  schedule:
    # Central time (cron is UTC; CST = UTC-6). 11:05 PM sets tomorrow's Top 10 for good;
    # the daytime runs only refresh the board, lines and prices.
    # GitHub often starts scheduled runs late or skips them, so the lock is attempted every 10 minutes
    # through the 11 PM-1 AM CT window (the 4 UTC runs cover daylight time). Runs before 11 PM never lock.
    - cron: '3,13,23,33,43,53 4,5,6 * * *'
    - cron: '7 16 * * *'
    - cron: '25 20 * * *'
    - cron: '25 21 * * *'
    - cron: '7 23 * * *'
  workflow_dispatch:
    inputs:
      repick_drop: {description: 'Locked plays to replace (names, ;-separated)', required: false, default: ''}
      repick_skip: {description: 'Teams whose games have started', required: false, default: ''}
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas pyarrow requests
      - run: npm install --no-save --no-audit --no-fund jsdom@24
      - name: Download hoopR box scores
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/sportsdataverse/hoopr-nba-data /tmp/hoopr
          cd /tmp/hoopr && git checkout HEAD -- nba/player_box/parquet/player_box_2027.parquet nba/player_box/parquet/player_box_2026.parquet nba/player_box/parquet/player_box_2025.parquet
      - name: Build slate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          REPICK_DROP: ${{ inputs.repick_drop }}
          REPICK_SKIP: ${{ inputs.repick_skip }}
        run: python scripts/update.py /tmp/hoopr/nba/player_box/parquet/player_box_2027.parquet /tmp/hoopr/nba/player_box/parquet/player_box_2026.parquet /tmp/hoopr/nba/player_box/parquet/player_box_2025.parquet
      - name: Publish if changed
        run: |
          git config user.name "plasmapicks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/
          git diff --cached --quiet || git commit -m "Update slate $(date -u +%F\ %H:%M)"
          git pull --rebase -X theirs -q && git push
